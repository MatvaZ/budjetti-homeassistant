add_transaction:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: budjetti
    amount:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: "€"
          mode: box
    category:
      required: true
      example: Ruoka
      selector:
        text:
    note:
      example: Lidl
      selector:
        text:
    date:
      selector:
        date:
    type:
      default: expense
      selector:
        select:
          translation_key: tx_type
          options:
            - expense
            - income
            - refund
set_budget:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: budjetti
    category:
      required: true
      example: Ruoka
      selector:
        text:
    amount:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 1
          unit_of_measurement: "€"
          mode: box
    month:
      example: "2026-11"
      selector:
        text:
    only_this_month:
      default: false
      selector:
        boolean:
delete_transaction:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: budjetti
    id:
      required: true
      selector:
        number:
          min: 1
          max: 100000000
          mode: box
